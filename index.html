<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Resource Tracker 🤖</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Index page custom styling */
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(120deg, #0a192f, #1e3a8a);
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #cbd5e1;
        }

        .btn-container {
            display: flex;
            gap: 20px;
        }

        a {
            text-decoration: none;
            color: white;
            background-color: #2563eb;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background-color: #1d4ed8;
            transform: scale(1.05);
        }

        footer {
            position: absolute;
            bottom: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <h1>AI Learning Resource Tracker 🤖</h1>
    <p>Organize, track, and boost your AI learning journey efficiently!</p>

    <div class="btn-container">
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
    </div>

    <footer>Developed by Team_MaverickS</footer>

</body>

</html>
